name: Build Locales

on:
  workflow_call:

jobs:
  lint:
    name: Locales - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Use Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          cache-dependency-path: locales/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: locales
      - name: Lint
        run: yarn run lint
        working-directory: locales
  test:
    name: Locales - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Use Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          cache-dependency-path: locales/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: locales
      - name: Test
        run: yarn run test
        working-directory: locales
