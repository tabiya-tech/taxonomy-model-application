name: Deploy Frontend

on:
  workflow_call:
    inputs:
      target-environment:
        required: true
        type: string
      version-info:
        required: true
        type: string
      target-domain-name:
        required: true
        type: string
      backend-url:
        required: true
        type: string
      locales-url:
        required: true
        type: string
      auth-url:
        required: true
        type: string
      cognito-client-id:
        required: true
        type: string
      cognito-client-secret:
        required: true
        type: string
    outputs:
      frontendBucketWebsiteURLBase:
        description: "The frontend bucket url"
        value: ${{ jobs.deploy.outputs.frontendBucketWebsiteURLBase }}

jobs:
  deploy:
    name: Frontend - Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-environment }}
    outputs:
      frontendBucketWebsiteURLBase: ${{ steps.pulumi.outputs.frontendBucketWebsiteURLBase }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'yarn'
          cache-dependency-path: iac/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: iac
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
          role-duration-seconds: 1200
          role-session-name: MySessionName
      - name: Download frontend.build.folder
        uses: actions/download-artifact@v7
        with:
          name: frontend.build.folder
          path: frontend/build/
      - name: Build env.js file
        # we are basically creating a js file with the passed env variables
        # that can be executed in the client browser when the js file is loaded
        env:
          INPUT_BACKEND_URL: ${{ inputs.backend-url }}
          INPUT_LOCALES_URL: ${{ inputs.locales-url }}
          INPUT_AUTH_URL: ${{ inputs.auth-url }}
          INPUT_COGNITO_CLIENT_ID: ${{ inputs.cognito-client-id }}
          INPUT_COGNITO_CLIENT_SECRET: ${{ inputs.cognito-client-secret }}
          INPUT_LOGO_URL: ${{ vars.LOGO_URL }}
          INPUT_NAVBAR_LOGOS: ${{ vars.NAVBAR_LOGOS }}
          INPUT_PARTNER_LOGOS: ${{ vars.PARTNER_LOGOS }}
          INPUT_FRONTEND_THEME_CSS_VARIABLES: ${{ vars.FRONTEND_THEME_CSS_VARIABLES }}
          INPUT_FRONTEND_BROWSER_TAB_TITLE: ${{ vars.FRONTEND_BROWSER_TAB_TITLE }}
          INPUT_FRONTEND_FAVICON_URL: ${{ vars.FRONTEND_FAVICON_URL }}
          INPUT_FRONTEND_APP_ICON_URL: ${{ vars.FRONTEND_APP_ICON_URL }}
          INPUT_FRONTEND_LANDING_COPY: ${{ vars.FRONTEND_LANDING_COPY }}
          INPUT_FRONTEND_LANDING_STATS: ${{ vars.FRONTEND_LANDING_STATS }}
          INPUT_FRONTEND_API_DOCS: ${{ vars.FRONTEND_API_DOCS }}
        run: |
          echo "window.tabiyaConfig = {" > frontend/build/data/env.js
          echo "\"BACKEND_URL\": btoa(\"$INPUT_BACKEND_URL\")," >> frontend/build/data/env.js
          echo "\"LOCALES_URL\": btoa(\"$INPUT_LOCALES_URL\")," >> frontend/build/data/env.js
          echo "\"AUTH_URL\": btoa(\"$INPUT_AUTH_URL\")," >> frontend/build/data/env.js
          echo "\"COGNITO_CLIENT_ID\": btoa(\"$INPUT_COGNITO_CLIENT_ID\")," >> frontend/build/data/env.js
          echo "\"COGNITO_CLIENT_SECRET\": btoa(\"$INPUT_COGNITO_CLIENT_SECRET\")," >> frontend/build/data/env.js
          echo "\"LOGO_URL\": \"$(printf '%s' "$INPUT_LOGO_URL" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"NAVBAR_LOGOS\": \"$(printf '%s' "$INPUT_NAVBAR_LOGOS" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"PARTNER_LOGOS\": \"$(printf '%s' "$INPUT_PARTNER_LOGOS" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_THEME_CSS_VARIABLES\": \"$(printf '%s' "$INPUT_FRONTEND_THEME_CSS_VARIABLES" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_BROWSER_TAB_TITLE\": \"$(printf '%s' "$INPUT_FRONTEND_BROWSER_TAB_TITLE" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_FAVICON_URL\": \"$(printf '%s' "$INPUT_FRONTEND_FAVICON_URL" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_APP_ICON_URL\": \"$(printf '%s' "$INPUT_FRONTEND_APP_ICON_URL" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_LANDING_COPY\": \"$(printf '%s' "$INPUT_FRONTEND_LANDING_COPY" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_LANDING_STATS\": \"$(printf '%s' "$INPUT_FRONTEND_LANDING_STATS" | base64 -w 0)\"," >> frontend/build/data/env.js
          echo "\"FRONTEND_API_DOCS\": \"$(printf '%s' "$INPUT_FRONTEND_API_DOCS" | base64 -w 0)\"" >> frontend/build/data/env.js
          echo "};" >> frontend/build/data/env.js
          cat frontend/build/data/env.js
      - name: Deploy frontend
        id: pulumi
        uses: pulumi/actions@v7
        with:
          work-dir: iac/frontend
          command: up
          stack-name: tabiya-tech/taxonomy-model-application-frontend/${{ inputs.target-environment }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DOMAIN_NAME: ${{ inputs.target-domain-name }}
